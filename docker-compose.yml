services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: fon-kpa-app

    env_file:
      - .env

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8080

      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: fon_kpa
      DB_USERNAME: root
      DB_PASSWORD: root

    volumes:
      - ./:/var/www/html


  nginx:
    image: nginx:1.27-alpine

    container_name: fon-kpa-nginx

    ports:
      - "8080:80"

    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - app


  mysql:
    image: mysql:8.0

    container_name: fon-kpa-mysql

    environment:
      MYSQL_DATABASE: fon_kpa
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql


volumes:
  mysql_data: